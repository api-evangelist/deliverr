name: Deliverr
description: Deliverr was an e-commerce fulfillment company founded in 2017 (Harish Abbott and Michael
  Krakaris) that offered fast, affordable outbound fulfillment for online sellers across marketplaces such
  as Shopify, Amazon, Walmart, eBay, and Wish, backed by 8vc and other investors. Shopify acquired Deliverr
  in 2022 and folded it into Shopify Logistics / the Shopify Fulfillment Network; in 2023 Shopify sold that
  logistics business to Flexport. Deliverr no longer operates as an independent company and publishes no
  standalone developer portal or API — its former domain (deliverr.com) now redirects to flexport.com, and
  its fulfillment capabilities live inside Flexport's platform. This profile is retained as a historical
  network stub; there is no live Deliverr API surface to enrich.
